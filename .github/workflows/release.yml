# Buduje paczki dla Windows, Linuksa i macOS. Uruchamiane ręcznie lub tagiem v*; tag publikuje Release.
name: release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux }    # stare glibc = szersza zgodność AppImage/deb
          - { os: windows-latest, platform: windows }
          - { os: macos-14, platform: macos }        # Apple Silicon
          - { os: macos-13, platform: macos }        # Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Zależności systemowe (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Paczki
        shell: bash
        run: tools/package.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: btb-cgeditor-${{ matrix.os }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.exe
            dist/*.zip
            dist/*.dmg
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: dist/* }
